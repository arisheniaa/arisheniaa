# ПРОВЕРКА СБОРКИ. Собирает сайт на чистой машине и смотрит, что получилось.
#
# ЭТОТ КОНВЕЙЕР НИЧЕГО НЕ ВЫКЛАДЫВАЕТ. Выкладкой занимается сервер: там
# сторож `autodeploy.sh` раз в 5 минут спрашивает у GitHub про новые коммиты
# и запускает `build.sh`. Два механизма, пишущих в один каталог, рано или
# поздно наступили бы друг другу на пятки, поэтому здесь остался только
# контроль. Подробности — в `DEPLOY.md`.
#
# Смысл проверки: сборка на СВОЕЙ машине может пройти на остатках прошлой
# сборки и на случайно установленных пакетах. Здесь чистый клон и `npm ci`
# строго по lock-файлу — если сборка сломана, это видно до того, как сервер
# заберёт коммит.
#
# Красный крест здесь означает, что до сервера доезжать нечему.

name: Проверка сборки

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 — версия, на которой сборка проверена вживую. Сервер собирает
          # в контейнере node:22; обе проходят, нижняя граница у Vite 8 —
          # 20.19.
          node-version: 24
          cache: npm
          cache-dependency-path: .design/hybrid/package-lock.json

      - name: Установить зависимости
        run: npm ci --prefix .design/hybrid

      - name: Собрать
        run: npm run build --prefix .design/hybrid

      # ═══ ЧТО ИМЕННО ПРОВЕРЯЕТСЯ ════════════════════════════════════════════
      # Не выход сборщика, а содержимое `dist/`. Оба случая ниже уже случались
      # в этом проекте, и оба давали ЗЕЛЁНУЮ сборку с испорченным сайтом:
      #
      # 1. Без плагина @tailwindcss/vite директивы Tailwind уходят в CSS
      #    необработанными: ни одной утилиты, страница разваливается в колонку.
      #    Ругается только lightningcss — предупреждением, кодом 0.
      #    (Подробно — в шапке vite.config.mts.)
      # 2. Сломанный комментарий в styles.css съедал следующее за ним правило
      #    `.rack-stack [data-layer]` — у стопки кадров пропадали скругление и
      #    тень. Молча, без единого предупреждения.
      - name: Проверить, что собралось именно то
        run: |
          cd .design/hybrid/dist
          fail() { echo "::error::$1"; exit 1; }
          grep -q '\.grid{' assets/*.css || fail 'В CSS нет утилит Tailwind — сборка без плагина, страница развалится в одну колонку'
          grep -q 'rack-stack \[data-layer\]' assets/App-*.css || fail 'Пропало правило .rack-stack [data-layer] — проверьте, не сломан ли комментарий в styles.css'
          # Файлы подтверждения прав в поисковиках проверяются наравне с
          # остальным: они выглядят необязательным мусором, и именно поэтому
          # их однажды удалят «за ненадобностью». Пропажа тихая — права
          # слетают не сразу, а при очередной перепроверке поисковиком.
          for f in index.html storyboard.html robots.txt sitemap.xml og.jpg yandex_9215e07c4779e6c9.html googlebd265f6afcbd754f.html; do
            [ -s "$f" ] || fail "В сборке нет файла $f"
          done
          echo "Собрано файлов: $(find . -type f | wc -l)"
          echo "Ассеты этой сборки:"
          grep -oE 'assets/[A-Za-z]+-[A-Za-z0-9_-]+\.(js|css)' index.html | sort -u
