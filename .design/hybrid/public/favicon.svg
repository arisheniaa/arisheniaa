<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>arisheniaa</title>
  <!--
    ЗНАЧОК ВКЛАДКИ (Ф42) — «фавикон в виде звёздочки, которая находится рядом
    с моим никнеймом».

    Путь БУКВА В БУКВУ тот же, что у StarMark в src/Stars.tsx: та самая
    семиугольная звезда из направления C, которая стоит слева от «arisheniaa»
    в шапке. Не похожая, не перерисованная — скопирована вместе со своей
    системой координат viewBox 0 0 40 40, потому что вся суть этой фигуры в
    смещённом центре, и пересчёт в другую сетку его бы сдвинул.

    Цвет звезды — переменная star-gold сайта, #f4b93f, тем же цветом она
    набрана в шапке (Name.tsx). Здесь вписан числом, а не переменной: этот
    файл браузер читает до всякого CSS, темы у него нет.

    ФОН ПРОЗРАЧНЫЙ — прямое требование владелицы: «хочу чтобы фавикон был
    звёздочкой на прозрачном фоне, то есть без подложки». Первая версия несла
    подложку цвета бумаги сайта из опасения, что охра потеряется на светлой
    панели вкладок; владелица предпочла чистый силуэт, и это её решение.
    Что это значит на практике: на тёмной панели (тёмная тема системы)
    звезда читается отлично, на очень светлой — мягче, чем читалась бы на
    подложке. Если когда-нибудь покажется бледной, вернуть плашку — это одна
    строка `rect` перед `path`.

    Рабочий размер вкладки 16 px, и звезда занимает почти всё поле
    намеренно: на такой сетке отступы съели бы силуэт, а он здесь
    единственное содержание.

    ВНИМАНИЕ ПРИ ПРАВКЕ: внутри комментария XML нельзя писать два дефиса
    подряд — из-за этого имя переменной выше набрано словами. Первая версия
    файла на этом и упала при сборке растровых копий (npm run favicon).
  -->
  <path
    d="M20.5 1 L24.2 13.8 L36.5 10.4 L28.9 20.6 L39 26.3 L26.4 27.6 L28.2 39 L19.2 31.2 L10.4 38.4 L12.1 26.6 L1 23.4 L11.6 18.2 L6.2 8.1 L18.1 13.2 Z"
    fill="#f4b93f"
  />
</svg>
