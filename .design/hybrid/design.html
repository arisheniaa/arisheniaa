<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arisheniaa · дизайн сайтов</title>
    <meta
      name="description"
      content="Разбираем ваш стиль и видение — и я собираю его в готовый сайт. Три работы: arisheniaa, Toto Shiro, «Элегия»."
    />
    <!-- Значок вкладки (Ф42) — те же три строки, что в `index.html` и
         `storyboard.html`, вместе с объяснением порядка. У сборки теперь три
         точки входа и общей шапки документа нет, дублируются намеренно. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Канонический адрес и карточка ссылки — по той же причине и с теми же
         оговорками, что в `index.html`, где они расписаны подробно. Значения
         свои — адрес, заголовок и описание ЭТОЙ страницы (см. пояснение в
         `storyboard.html`, почему копировать блок главной целиком нельзя).

         Картинка карточки общая с главной, осознанно: свой пейзажный кадр
         1200×630 для этой страницы пришлось бы выбирать из скриншотов, а
         скриншот сайта в карточке ссылки читается как реклама конструктора,
         не как ссылка на автора. Если появится желание — кадр меняется одной
         строкой здесь. -->
    <link rel="canonical" href="https://arisheniaa.ru/design.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="arisheniaa" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://arisheniaa.ru/design.html" />
    <meta property="og:title" content="arisheniaa · дизайн сайтов" />
    <meta
      property="og:description"
      content="Разбираем ваш стиль и видение — и я собираю его в готовый сайт. Три работы: arisheniaa, Toto Shiro, «Элегия»."
    />
    <meta property="og:image" content="https://arisheniaa.ru/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Фигура идёт по высокой траве утреннего поля, солнце за спиной, дальний край поля растворён в дымке"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design/main.tsx"></script>
  </body>
