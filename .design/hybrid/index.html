<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arisheniaa · аришения — портретный фотограф, Москва и Тула</title>
    <meta
      name="description"
      content="Портретная съёмка на цифру и на плёнку. От 4 000 ₽ за час в Туле, от 6 000 ₽ в Москве. Три жанра съёмки, цены и условия без звёздочек."
    />
    <!--
      ЗНАЧОК ВКЛАДКИ (Ф42) — семиугольная звезда из шапки, та же, что стоит
      слева от «arisheniaa». Источник один, `public/favicon.svg`; растровые
      копии делает `npm run favicon`, руками их не рисуют.

      ПОРЯДОК СТРОК ЗНАЧИМ. Браузер берёт последний подходящий ему `icon`:
      современный доходит до svg и останавливается на нём, старый на svg
      спотыкается и остаётся с png. Поэтому png идёт первым, svg вторым —
      наоборот работало бы наоборот.

      `apple-touch-icon` — отдельной строкой: iOS при добавлении страницы на
      домашний экран смотрит только на него и векторный значок игнорирует.

      Те же три строки продублированы в `storyboard.html`: у сборки две
      точки входа, и общей «шапки документа» у них нет.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      КАНОНИЧЕСКИЙ АДРЕС. Одна и та же страница доступна минимум по четырём
      адресам: с `www` и без, по http и по https. Для поиска это четыре разные
      страницы с одинаковым текстом, то есть дубли, и вес делится между ними.
      `canonical` называет главный из адресов явно.

      Адрес АБСОЛЮТНЫЙ и с доменом — относительный `canonical` разрешается
      относительно текущего адреса и потому не устраняет ровно ту проблему,
      ради которой ставится.
    -->
    <link rel="canonical" href="https://arisheniaa.ru/" />
    <!--
      КАРТОЧКА ССЫЛКИ (Open Graph). Без этих строк ссылка на сайт в телеграме,
      вотсапе и соцсетях разворачивается голым текстом. Для фотографа это
      заметнее позиции в выдаче: ссылку чаще пересылают в личном сообщении,
      чем находят поиском.

      `og:image` — `public/og.jpg`, 1200×630, средняя полоса кадра
      `frames/pole.webp`. Кадр выбран не случайно: он единственный на сайте,
      который снят вертикально, но по содержанию является пейзажем, поэтому
      горизонтальная обрезка даёт законный широкий кадр, а не обрубок
      портрета. Остальные кадры вертикальные по сути, и в 1200×630 от них
      осталась бы полоса. Если будете менять картинку — проверяйте именно
      это, а не только размер файла.

      Размеры указаны отдельными строками намеренно: без них телеграм
      показывает карточку без картинки, пока не скачает файл целиком, а на
      медленной сети это выглядит как «картинка не работает».

      Адреса здесь тоже абсолютные: сборщик карточки приходит со стороны и
      относительный путь ему разрешать не от чего.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="arisheniaa" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://arisheniaa.ru/" />
    <meta
      property="og:title"
      content="arisheniaa · аришения — портретный фотограф, Москва и Тула"
    />
    <meta
      property="og:description"
      content="Портретная съёмка на цифру и на плёнку. От 4 000 ₽ за час в Туле, от 6 000 ₽ в Москве. Три жанра съёмки, цены и условия без звёздочек."
    />
    <meta property="og:image" content="https://arisheniaa.ru/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Фигура идёт по высокой траве утреннего поля, солнце за спиной, дальний край поля растворён в дымке"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
