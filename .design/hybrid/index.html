<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arisheniaa · аришения — портретный фотограф, Москва и Тула</title>
    <meta
      name="description"
      content="Портретная съёмка на цифру и на плёнку. От 4 000 ₽ за час в Туле, от 6 000 ₽ в Москве. Три жанра съёмки, цены и условия без звёздочек."
    />
    <!--
      ЗНАЧОК ВКЛАДКИ (Ф42) — семиугольная звезда из шапки, та же, что стоит
      слева от «arisheniaa». Источник один, `public/favicon.svg`; растровые
      копии делает `npm run favicon`, руками их не рисуют.

      ПОРЯДОК СТРОК ЗНАЧИМ. Браузер берёт последний подходящий ему `icon`:
      современный доходит до svg и останавливается на нём, старый на svg
      спотыкается и остаётся с png. Поэтому png идёт первым, svg вторым —
      наоборот работало бы наоборот.

      `apple-touch-icon` — отдельной строкой: iOS при добавлении страницы на
      домашний экран смотрит только на него и векторный значок игнорирует.

      Те же три строки продублированы в `storyboard.html`: у сборки две
      точки входа, и общей «шапки документа» у них нет.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
